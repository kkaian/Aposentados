# Backup do banco a cada 3 dias. Também evita que o Supabase pause por inatividade (7 dias).
# O repositório é público: o arquivo sai criptografado e só abre com BACKUP_PASSPHRASE.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     postgresql://postgres.sfbzyfgmdtbohnpnfsmu:SENHA@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   senha para abrir o backup (guarde fora do GitHub)
#
# Para abrir: openssl enc -d -aes-256-cbc -pbkdf2 -in backup.tar.gz.enc -out backup.tar.gz && tar xzf backup.tar.gz

name: Backup do banco

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-save --no-audit --no-fund pg

      - name: Exportar tabelas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup.mjs

      - name: Criptografar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta o secret BACKUP_PASSPHRASE"; exit 1; }
          tar czf backup.tar.gz backup
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.tar.gz -out backup.tar.gz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf backup backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backup.tar.gz.enc
          retention-days: 90
